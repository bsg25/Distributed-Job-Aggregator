services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      WWW_ADDRESS: ${WWW_ADDRESS:-http://www.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    oom_score_adj: -600
    environment:
      POSTGRES_DB: dist_jobs_scheduler
      POSTGRES_USER: ${DB_USER:-jobs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobs}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d dist_jobs_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400m

  backend:
    build: ./backend
    restart: unless-stopped
    oom_score_adj: 200
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-jobs}
      DB_PASSWORD: ${DB_PASSWORD:-jobs}
      RABBITMQ_HOST: rabbitmq
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64m

  poller:
    build: ./poller
    restart: unless-stopped
    oom_score_adj: 200
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-jobs}
      DB_PASSWORD: ${DB_PASSWORD:-jobs}
      RABBITMQ_HOST: rabbitmq
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      POLL_MINUTES: ${POLL_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500m

  worker:
    build: ./worker
    restart: unless-stopped
    oom_score_adj: 200
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-jobs}
      DB_PASSWORD: ${DB_PASSWORD:-jobs}
      RABBITMQ_HOST: rabbitmq
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 400m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
